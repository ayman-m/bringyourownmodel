category: Utilities
commonfields:
  id: GuardianCohere
  version: -1
name: GuardianCohere
display: Guardian Cohere
description: >-
  Cohere North model provider for Guardian. It implements the `guardian-llm-chat` command, like every other
  Guardian provider, and returns the standard `Guardian.LLM.Completion` result, so the rest of the pack works
  the same whichever model you use. It connects to a private Cohere North deployment: it sends the chat
  request to `/api/v1/chat` and then reads the reply from `/api/v1/conversations/{id}`, using the agent id,
  session (conversation) id and bearer token you configure. Enable only one Guardian model provider
  integration at a time.
configuration:
- display: Endpoint URL
  name: endpoint_url
  type: 0
  required: true
  additionalinfo: >-
    Base URL of the Cohere North deployment, e.g. https://core.example.com (no path suffix). The
    integration appends /api/v1/chat and /api/v1/conversations/{id}.
- display: Agent ID
  name: agent_id
  type: 0
  required: true
  additionalinfo: >-
    The Cohere North agent id sent as agent.id on every chat request (identifies the pre-configured
    North agent/persona serving the conversation).
- display: Session ID (conversation id)
  name: session_id
  type: 0
  required: false
  additionalinfo: >-
    The Cohere North conversation id, sent as `conversation.id`. It is required only in "reuse" mode: a
    conversation you created in North, used for every call. In "per_run" and "stateless" mode Guardian creates the
    conversation ids itself and this field is never sent as a conversation id; leave it empty.
- display: Bearer token
  name: bearer_token
  type: 4
  required: true
  additionalinfo: >-
    The API bearer token for the North deployment, sent as Authorization: Bearer <token>. Stored
    encrypted.
- display: Conversation mode
  name: conversation_mode
  type: 15
  required: true
  defaultvalue: reuse
  options:
  - reuse
  - stateless
  - per_run
  additionalinfo: >-
    How Guardian maps its work onto North conversations. North keeps the whole history of a conversation and
    gives all of it to the model on every turn, so this setting decides what the model can see.
    "per_run" (recommended): one conversation per Guardian run. The first model call of a run opens a new
    conversation whose first message starts with a line such as "Guardian run - incident 1234 - 2026-10-27 14:05",
    so you can find an incident's runs in North. Every later call of that run continues the same conversation
    and sends only the new messages. A new run, including a re-run of the same incident, opens a new conversation.
    The Session ID is not needed. This needs a North deployment that accepts conversation ids from the client.
    "stateless": a new conversation for every model call, with the full transcript sent each time. The model only
    sees that transcript, but North shows one conversation per model call. "reuse": the Session ID is the one
    conversation for everything, and only the new messages are sent. All incidents and runs share it, so the model
    can answer from an earlier run and token use keeps growing; it is not recommended for more than one run at a
    time.
- display: Tool format
  name: tool_format
  type: 15
  required: true
  defaultvalue: openai
  options:
  - openai
  - cohere
  additionalinfo: >-
    Format of the tool (function) definitions. "openai" (default) sends OpenAI function tools unchanged.
    "cohere" converts them to Cohere `parameter_definitions`, for North builds that need that format. Used
    only when Guardian sends tools.
- display: Tool results
  name: tool_result_format
  type: 15
  required: false
  defaultvalue: native
  options:
  - native
  - text
  additionalinfo: >-
    How a tool call and its result are sent back to North on the turn after Guardian ran the tool. "native"
    (default) sends them as OpenAI `tool_calls` and `role: tool` messages. Choose "text" for a North deployment that
    does not accept those messages: the turn after a tool call never gets a reply (the poll times out, or North shows
    an empty conversation). "text" sends the tool call as a plain assistant line and the result as a plain user
    message instead. The tool definitions are still sent, so the model can call the next tool.
- display: Model label
  name: model
  type: 0
  required: false
  defaultvalue: cohere-north
  additionalinfo: >-
    Label reported as `Guardian.LLM.Completion.model` and by `!guardian-model`. North does not report a model
    name, because the agent you configure decides which model is used. The label is for display only.
- display: Model ID
  name: model_id
  type: 0
  required: false
  additionalinfo: >-
    Optional. The model name sent to North with every request (as `model`). Leave empty and North uses the agent's
    own model, which on some deployments is a name the deployment does not have (error MODEL_NOT_FOUND, model_id
    "command"). Run `!guardian-cohere-list-models` to see the models this endpoint offers, then enter the model's name
    here (if North refuses it, try the Id), and set the Model label to the same value.
- display: Model size
  name: model_tier
  type: 15
  required: true
  defaultvalue: auto
  options:
  - auto
  - small
  - medium
  - large
  additionalinfo: >-
    The capability class of the model that runs behind this North agent, for information. "auto" (the default)
    declares nothing: the size a run uses is taken from the model catalogue, looked up by the model name. Choose
    "small", "medium" or "large" only to document a model that is not in the catalogue, and set the same value in
    `guardian_settings.model_tier` (the field itself changes nothing). The size is also shown next to the Model
    label in `Guardian.LLM.Completion` and by `!guardian-model`, and Guardian warns when a declared size differs
    from the size a run uses; "auto" never does. "small": under 13B parameters, for example Cohere Command R7B.
    "medium": 13B to 40B, for example Cohere Command R 32B. "large": over 40B, or a large mixture-of-experts
    model, for example Cohere Command R+ or Command A.
- display: Request timeout (seconds)
  name: request_timeout
  type: 0
  required: false
  defaultvalue: '200'
  additionalinfo: >-
    Per-HTTP-call timeout (seconds) for the chat POST and each conversation GET. North generation can
    be slow; the default matches the reference client. It is also how long Guardian waits for the model's
    reply to one turn (at most 600 seconds): raise it for a large model whose first turn is slow, and keep it
    under the reasoning script's own timeout.
- display: Trust any certificate (not secure)
  name: insecure
  type: 8
  required: false
- display: Use system proxy settings
  name: proxy
  type: 8
  required: false
script:
  script: '-'
  type: python
  subtype: python3
  dockerimage: demisto/python3:3.11.10.116949
  isfetch: false
  runonce: false
  commands:
  - name: guardian-llm-chat
    description: >-
      Provider-independent chat completion. Sends OpenAI-Chat-Completions-shaped messages
      (and optional tool definitions / structured-output schema) through the configured
      provider adapter, and returns a normalized completion under Guardian.LLM.Completion
      regardless of which provider served the request.
    arguments:
    - name: messages
      required: false
      description: >-
        JSON array of OpenAI Chat-Completions message objects, e.g.
        [{"role":"system","content":"..."},{"role":"user","content":"..."}]. Supports the
        full message shape including "name", "tool_call_id", and assistant "tool_calls".
        Mutually exclusive with system_message/user_message -- provide this OR that pair,
        never both. Required if user_message is not given.
    - name: system_message
      required: false
      description: >-
        Convenience alternative to messages, for a single interactive turn (e.g. testing from
        the Playground) without hand-formatting a JSON array. Optional system-role text.
        Ignored/rejected if messages is also provided.
    - name: user_message
      required: false
      description: >-
        Convenience alternative to messages: the user-role text for a single turn. Required
        if messages is not given; combined with system_message (if set) into a two-message
        array. Ignored/rejected if messages is also provided.
    - name: tools
      required: false
      description: >-
        JSON array of OpenAI "tools" (function) definitions to make available for tool/function
        calling, e.g. [{"type":"function","function":{"name":"...","parameters":{...}}}].
    - name: tool_choice
      required: false
      description: >-
        Either a plain string ("auto" | "none" | "required") or a JSON object selecting one
        specific tool, e.g. {"type":"function","function":{"name":"my_tool"}}.
    - name: response_format
      required: false
      description: >-
        JSON object requesting structured output, e.g. {"type":"json_object"} or
        {"type":"json_schema","json_schema":{...}}. Only honored if the configured
        model/provider supports structured outputs; unsupported providers will surface the
        provider's own error.
    - name: temperature
      required: false
      description: Sampling temperature (provider-dependent range, typically 0-2).
    - name: reasoning_effort
      required: false
      description: 'Reasoning effort hint for reasoning-capable models: low | medium | high.'
      auto: PREDEFINED
      predefined:
      - low
      - medium
      - high
    - name: parallel_tool_calls
      required: false
      description: Whether the model may return multiple tool calls in one response (true/false).
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
    - name: model
      required: false
      description: >-
        Optional. Run this call on another model than the instance's configured one. Empty (the default) uses the
        configured model, exactly as before. This provider runs a fixed Cohere North agent and cannot choose a model per call: a value that differs from the instance's Model label is refused. An unknown model gives an error that starts with `MODEL_SELECTION_UNSUPPORTED:`.
    - name: timeout
      required: false
      description: Per-call time limit in seconds. One deadline for the whole turn (conversation read, submit and poll; no retries), never longer than the instance's request timeout. Leave empty for the default.
    outputs:
    - contextPath: Guardian.LLM.Completion.id
      description: Provider-assigned completion id (null for a request blocked by a content filter before generation).
      type: String
    - contextPath: Guardian.LLM.Completion.model
      description: Model (or deployment) that served the request.
      type: String
    - contextPath: Guardian.LLM.Completion.created
      description: Unix timestamp of the completion, as reported by the provider.
      type: Number
    - contextPath: Guardian.LLM.Completion.choices.index
      description: Choice index.
      type: Number
    - contextPath: Guardian.LLM.Completion.choices.message.role
      description: Role of the returned message (normally "assistant").
      type: String
    - contextPath: Guardian.LLM.Completion.choices.message.content
      description: Text content of the returned message (may be null when only tool_calls are returned).
      type: String
    - contextPath: Guardian.LLM.Completion.choices.message.tool_calls
      description: Tool/function calls requested by the model, in OpenAI tool_calls shape.
      type: Unknown
    - contextPath: Guardian.LLM.Completion.choices.finish_reason
      description: 'Per-choice normalized finish reason: stop | length | tool_calls | content_filter | other provider-reported values.'
      type: String
    - contextPath: Guardian.LLM.Completion.finish_reason
      description: Normalized finish reason of the first choice, surfaced at the top level for convenience.
      type: String
    - contextPath: Guardian.LLM.Completion.content_filter
      description: True if this request or response was blocked/flagged by the provider's content filter.
      type: Boolean
    - contextPath: Guardian.LLM.Completion.content_filter_detail
      description: Structured detail (message, raw provider error) when content_filter is true and the block happened on the input (pre-generation) side.
      type: Unknown
    - contextPath: Guardian.LLM.Completion.usage.prompt_tokens
      description: Prompt tokens billed for the request.
      type: Number
    - contextPath: Guardian.LLM.Completion.usage.completion_tokens
      description: Completion tokens billed for the request.
      type: Number
    - contextPath: Guardian.LLM.Completion.usage.total_tokens
      description: Total tokens billed for the request.
      type: Number
    - contextPath: Guardian.LLM.Completion.usage.cached_tokens
      description: Cached prompt-token count, when the provider reports one (e.g. OpenAI prompt_tokens_details.cached_tokens); null otherwise.
      type: Number
  - name: guardian-cohere-list-models
    description: >-
      Lists the models this Cohere North endpoint offers to the token's user (GET /api/v2/models, paged; falls
      back to /api/v1/models), so a model name can be checked before it is entered as the Model ID. Read-only.
    arguments: []
    outputs:
    - contextPath: GuardianCohere.Model.id
      description: Model id as North reports it.
      type: String
    - contextPath: GuardianCohere.Model.name
      description: Model name (the identifier North's agents use).
      type: String
    - contextPath: GuardianCohere.Model.display_name
      description: Name shown in the North model picker.
      type: String
    - contextPath: GuardianCohere.Model.provider
      description: Provider type behind the model (for example single_container).
      type: String
    - contextPath: GuardianCohere.Model.instance
      description: Provider instance, when North reports one.
      type: String
    - contextPath: GuardianCohere.Model.context_length
      description: Context window in tokens, when North reports it.
      type: Number
    - contextPath: GuardianCohere.Model.max_tokens
      description: Maximum output tokens, when North reports it.
      type: Number
    - contextPath: GuardianCohere.Model.supported_parameters
      description: Features North reports for the model (thinking, vision, json_schema, strict_tools, logprobs, safety_mode, json_object).
      type: Unknown
    - contextPath: GuardianCohere.Model.default
      description: True when North marks the model as the default.
      type: Boolean
fromversion: 6.10.0
marketplaces:
- xsoar
tests:
- No tests (auto formatted)
