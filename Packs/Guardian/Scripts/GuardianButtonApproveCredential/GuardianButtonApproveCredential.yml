args:
- name: approval_id
  description: >-
    The approval ID of the pending credential-tier request, copied from the Recommended Actions table.
  required: true
  isArray: false
  default: false
  secret: false
- name: confirm
  description: >-
    Type CONFIRM (capital letters) to confirm that you approve a request that handles credentials.
  required: true
  isArray: false
  default: false
  secret: false
comment: >-
  Guardian Agent Run layout button. Approves a credential-tier action by its approval ID and the word CONFIRM,
  through the operator-only `guardian-approve` command; the agent then runs it once on its next reasoning
  tick. It refuses an approval that belongs to another incident. Operator-only: it is not on the agent's
  allowlist and the agent cannot call it.
commonfields:
  id: GuardianButtonApproveCredential
  version: -1
enabled: true
name: GuardianButtonApproveCredential
outputs: []
script: '-'
system: false
tags:
- incident-action-button
timeout: '0'
type: python
subtype: python3
dockerimage: demisto/python3:3.11.10.116949
fromversion: 6.10.0
marketplaces:
- xsoar
