args: []
comment: >-
  The second dynamic section of the Guardian tab of the Guardian Agent Run layout (the relationship map, the causality chain and the timeline). The incident page limits
  how much one dynamic section may return, so the assessment page is three sections and a section cannot pass an
  argument: this one runs GuardianLayoutAssessment with part=story and shows what it returns, unchanged. When there is no
  report of the current run it says to see the assessment above. Display only; it never raises.
