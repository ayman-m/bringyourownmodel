args: []
comment: >-
  Runs after the model session and stores one memory row for the finished run (key run:<incident id>): the
  incident's family, rule, main entities, verdict, confidence and one-line summary, tagged so that later runs on the
  same rule or entity find it. Needs no Job and does not depend on the model remembering to store anything. Writes
  nothing when the run ended without a verdict. Changes no incident field.
commonfields:
  id: GuardianRunCapture
  version: -1
enabled: true
name: GuardianRunCapture
outputs:
- contextPath: Guardian.RunCapture.status
  description: stored, skipped or error.
  type: String
- contextPath: Guardian.RunCapture.detail
  description: The memory key that was written, or why nothing was.
  type: String
script: '-'
system: false
tags: []
timeout: '0'
type: python
subtype: python3
dockerimage: demisto/python3:3.11.10.116949
fromversion: 6.10.0
marketplaces:
- xsoar
