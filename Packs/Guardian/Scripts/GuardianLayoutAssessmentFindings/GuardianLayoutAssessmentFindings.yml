args: []
comment: >-
  The third dynamic section of the Guardian tab of the Guardian Agent Run layout (the findings, the recommended actions, the gaps and the footer). The incident page limits
  how much one dynamic section may return, so the assessment page is three sections and a section cannot pass an
  argument: this one runs GuardianLayoutAssessment with part=findings and shows what it returns, unchanged. When there is no
  report of the current run it says to see the assessment above. Display only; it never raises.
commonfields:
  id: GuardianLayoutAssessmentFindings
  version: -1
enabled: true
name: GuardianLayoutAssessmentFindings
outputs: []
script: '-'
system: false
tags:
- dynamic-section
timeout: '0'
type: python
subtype: python3
dockerimage: demisto/python3:3.11.10.116949
fromversion: 6.10.0
marketplaces:
- xsoar
