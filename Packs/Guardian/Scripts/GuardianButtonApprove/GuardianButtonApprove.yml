args:
- name: approval_id
  description: >-
    The approval ID of the pending request, copied from the Approval ID column of the Recommended
    Actions table.
  required: true
  isArray: false
  default: false
  secret: false
comment: >-
  Guardian Agent Run layout button. Approves a pending action by its approval ID (shown in the Recommended
  Actions table) through the operator-only `guardian-approve` command; the agent then runs it once on its next
  reasoning tick. It refuses an approval that belongs to another incident. A credential-tier request needs the
  Approve (credential tier) button instead. Operator-only: it is not on the agent's allowlist and the agent
  cannot call it.
commonfields:
  id: GuardianButtonApprove
  version: -1
enabled: true
name: GuardianButtonApprove
outputs: []
script: '-'
system: false
tags:
- incident-action-button
timeout: '0'
type: python
subtype: python3
dockerimage: demisto/python3:3.11.10.116949
fromversion: 6.10.0
marketplaces:
- xsoar
