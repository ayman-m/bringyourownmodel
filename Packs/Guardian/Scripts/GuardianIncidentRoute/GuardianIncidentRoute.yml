args:
- name: skill_override
  description: >-
    Optional. A skill name that replaces the routed skill (the playbook passes its `skill` input here). The family,
    domain, evidence plan and assessment mode are still taken from the routing table.
  required: false
  isArray: false
  default: false
  secret: false
comment: >-
  Decides what kind of incident the current one is (phishing, identity, endpoint, network, data exposure,
  vulnerability, or general) from its own type, category, source integration, name and labels, and picks the domain,
  the skill, the evidence plan and the kind of assessment for it from the `guardian_incident_routes` List. Also
  records the incident's rule and main entities for the evidence step. Read-only: it calls no model and changes
  nothing.
commonfields:
  id: GuardianIncidentRoute
  version: -1
enabled: true
name: GuardianIncidentRoute
outputs:
- contextPath: Guardian.Route.family
  description: "phishing, identity, endpoint, network, data_exposure, vulnerability, general, or a family an operator added."
  type: String
- contextPath: Guardian.Route.domain
  description: "detection (a threat or alert) or posture (a scanner finding). The triage result checks the model's investigation type against it."
  type: String
- contextPath: Guardian.Route.skill
  description: The skill to load for this incident (the override when one was given).
  type: String
- contextPath: Guardian.Route.evidence_plan
  description: Names of the evidence steps the pre-fetch should run for this family.
  type: Unknown
- contextPath: Guardian.Route.assessment_mode
  description: "verdict (Malicious / Suspicious / Benign / Inconclusive) or none."
  type: String
- contextPath: Guardian.Route.run_model
  description: '"true", or "false" when the route needs no model session.'
  type: String
- contextPath: Guardian.Route.route_id
  description: The id of the table row that matched, or "default".
  type: String
- contextPath: Guardian.Route.reason
  description: Why this route was chosen, including any skill fallback.
  type: String
- contextPath: Guardian.Route.signals
  description: The facts the route was based on (type, category, source, labels, name) plus the incident's rule and main entities.
  type: Unknown
script: '-'
system: false
tags: []
timeout: '0'
type: python
subtype: python3
dockerimage: demisto/python3:3.11.10.116949
fromversion: 6.10.0
marketplaces:
- xsoar
