id: GuardianTriageEndpointThreat
version: -1
name: GuardianTriageEndpointThreat
description: >-
  Triage branch for malware, suspicious execution or persistence on a host. Collects read-only enrichment for
  it (the endpoint record (Endpoint, EndpointData: status, operating system, isolation), the file hash
  reputation (File, DBotScore) and the address reputation (IP)), adds it to the evidence packet, then runs a full investigation. Every lookup is skipped when its input is empty and continues on error; nothing here
  changes the incident, and the model session proposes actions and takes none.
