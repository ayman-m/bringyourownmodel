id: GuardianTriageOther
version: -1
name: GuardianTriageOther
description: >-
  Triage branch for an incident that fits no type, or whose triage answer could not be used or did not fit the
  incident's domain. There is no type-specific enrichment, but the incident still gets a full investigation, with the
  same judging rules as the typed branches: it loads the skill the incident route chose, runs one model session over
  the evidence packet and ends with the verdict block. The incident's phase was already set to "Guardian triage:
  needs analyst" by the triage apply step. Everything the model session reads is read-only; it proposes actions and
  takes none.
