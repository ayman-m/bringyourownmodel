id: GuardianTriagePhishing
version: -1
name: GuardianTriagePhishing
description: >-
  Triage branch for a reported or detected email: phishing, a malicious attachment or link, or business email
  compromise. Collects read-only enrichment for it (the URL, domain and attachment reputation from the threat-
  intelligence integrations (DBotScore, URL, Domain, File) and other incidents from the same sender
  (foundIncidents)), adds it to the evidence packet, then runs a full investigation. Every lookup is
  skipped when its input is empty and continues on error; nothing here changes the incident, and the model
  session proposes actions and takes none.
