id: GuardianTriageIdentityThreat
version: -1
name: GuardianTriageIdentityThreat
description: >-
  Triage branch for a sign-in anomaly, credential use, brute force or session abuse by a person or service
  account. Collects read-only enrichment for it (the user record from the identity integrations (UserData),
  the source address reputation (IP, DBotScore) and other incidents from the same address (foundIncidents)),
  adds it to the evidence packet, then runs a full investigation. Every lookup is skipped when its input
  is empty and continues on error; nothing here changes the incident, and the model session proposes actions
  and takes none.
