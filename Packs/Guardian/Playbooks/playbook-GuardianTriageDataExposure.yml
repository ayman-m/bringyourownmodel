id: GuardianTriageDataExposure
version: -1
name: GuardianTriageDataExposure
description: >-
  Triage branch for a data loss prevention alert, exfiltration, or public or over-shared data. Collects read-
  only enrichment for it (the user record (UserData), the endpoint record (Endpoint) and the destination
  domain and URL reputation (Domain, URL, DBotScore)), adds it to the evidence packet, then runs a full investigation. Every lookup is skipped when its input is empty and continues on error; nothing here changes
  the incident, and the model session proposes actions and takes none.
