id: GuardianTriageAndInvestigateIncident
version: -1
name: GuardianTriageAndInvestigateIncident
description: >-
  Triages THIS XSOAR incident with a short model session, then runs a full investigation on it, acting on the
  triage answer by fixed rules, not by prose. The standard Guardian preparation (kill switch, job guard, incident
  routing, model profile, evidence packet, system prompt, tool list) is followed by one short triage session that
  ends with a fixed block (severity, type, confidence, analysis, recommendations, complexity). A program validates
  the block, with one repair call and then a fallback, and the playbook sets the incident's severity and phase
  (never its type or status), then chooses the investigation model, resolves its profile, gathers the evidence
  again for it and branches by type to a sub-playbook that collects read-only enrichment and runs a full model
  investigation with the same judging rules as an investigation run. The playbook writes the triage summary and
  the investigation conclusion as War Room notes and appends them to the incident's details in one delimited
  Guardian section (the original text is never changed). Containment and other state changes still wait for a
  human. The investigation playbook GuardianAgentLoop is unchanged.
