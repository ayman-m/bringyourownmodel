inputs:
- key: prompt
  value:
    simple: |-
      You are triaging THIS XSOAR incident, number ${incident.id} (you are already assigned to it: do NOT search for or switch to another incident, never invent an id, and never ask anyone for it). This is a TRIAGE run: you rate the incident and name its type, you do not investigate it end to end.
      1) READ THE EVIDENCE PACKET pinned above first. It holds what XSOAR already knows: the incident's fields, the indicators linked to it with their reputation, other open incidents with the same name, how earlier incidents with the same name were closed, and what Guardian remembers about the alert and its entities. Do not fetch again what is there. A section listed as not available is unknown, not empty.
      2) FOLLOW THE ACTIVE SKILL (xsoar_triage). Make at most a few lookups, ONE tool call per turn, and only when the result could change the severity or the type: the reputation of one address, domain, URL or file the packet has no verdict for, the host as an endpoint tool sees it, or one narrow search for earlier incidents about the same entity. A failed or empty lookup is not evidence either way: say so and carry on.
      3) Do NOT write a case note, do NOT store a memory row and do NOT change anything: no setIncident, no closeInvestigation, no containment. The playbook records the outcome.
      4) END with EXACTLY the triage block from the skill and nothing after it: severity, investigation_type, confidence, likely_benign, escalate, summary, key_entities and next_step, and optionally analysis (2-4 sentences on what you saw and why you rated it so), recommendations (up to 5 short next actions) and complexity (low, medium or high: how much investigation the incident needs, by the rubric in the skill). Every value comes from the allowed lists in the skill; use `other` for the type when nothing fits.
  required: false
  description: >-
    Triage prompt: triage THIS incident by reading the pinned packet and the triage skill, with at most a few
    lookups, and end with exactly the triage block. No case note, no memory row, no changes.
  playbookInputQuery: null
- key: apply_changes
  value:
    simple: "true"
  required: false
  description: >-
    When "true" (the default), the triage result sets the incident's severity and phase through the guarded
    apply task, and the two summary tasks write their notes and the Guardian section of the details. Set to
    "false" for a dry run that writes only the apply task's case note.
  playbookInputQuery: null
- key: triage_max_ticks
  value:
    simple: "6"
  required: false
  description: >-
    The most model turns the triage session may take. It can only lower the tick limit set in
    guardian_settings.
  playbookInputQuery: null
- key: investigate_max_ticks
  value:
    simple: ""
  required: false
  description: >-
    Optional cap on the model turns of the investigation session of the chosen sub-playbook. It goes to the task
    "Choose the investigation model", which hands the effective limit to the branch (passed to its max_ticks
    input): this input when it is set, else the max_ticks of the level in the guardian_model_routing List, else
    nothing. Empty (the default) with the List as shipped gives that session the same limit GuardianAgentLoop
    gets: the model size's limit (25, 40 or 60), or the guardian_settings and model profile override. A number
    can only lower that limit.
  playbookInputQuery: null
