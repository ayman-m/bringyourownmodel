id: GuardianTriageIncident
version: -1
name: GuardianTriageIncident
description: >-
  Triages THIS XSOAR incident with a short model session and then acts on its answer by fixed rules, not by
  prose. The standard Guardian preparation (kill switch, job guard, incident routing, model profile, evidence
  packet, system prompt, tool list) is followed by one short triage session that ends with a fixed block
  (severity, type, confidence). A program validates the block, with one repair call and then a fallback, and
  the playbook sets the incident's severity and phase (never its type, description or status), then branches
  by type to a sub-playbook that collects read-only enrichment and runs one focused model session. Containment
  and other state changes still wait for a human. The investigation playbook GuardianAgentLoop is unchanged.
