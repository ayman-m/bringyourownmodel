id: GuardianTriageNetworkThreat
version: -1
name: GuardianTriageNetworkThreat
description: >-
  Triage branch for a network detection: command and control, scanning, an IDS, IPS or firewall alert, or
  suspicious traffic. Collects read-only enrichment for it (the address, domain and URL reputation (IP,
  Domain, URL, DBotScore), the internal endpoint that holds the address (Endpoint) and other incidents with
  the same address (foundIncidents)), adds it to the evidence packet, then runs a full investigation.
  Every lookup is skipped when its input is empty and continues on error; nothing here changes the incident,
  and the model session proposes actions and takes none.
