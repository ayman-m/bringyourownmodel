id: GuardianApprovalGate
version: -1
name: GuardianApprovalGate
description: >-
  On-demand snapshot of the pending approvals for this incident (the same data the Guardian layout's Recommended
  Actions section shows). A playbook task does not resolve approvals: the agent loop parks a gated action in the
  approvals ledger, and a person resolves it in the War Room with `!guardian-approve approval_id=<id>
  [confirm=CONFIRM]` or `!guardian-deny approval_id=<id> reason="..."`. The agent can never call either command.
  Running this playbook does not create, approve or deny anything.
