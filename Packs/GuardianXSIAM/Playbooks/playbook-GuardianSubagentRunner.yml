id: GuardianSubagentRunner
version: -1
name: GuardianSubagentRunner
description: >-
  Runs one named specialist sub-investigation through GuardianSubagentDispatch. The specialist's whole bounded
  investigation completes inside one script execution (a hard-capped iteration counter, not a self-rescheduling loop),
  so no polling is used. The playbook gives the dispatch tool a runnable form for testing: running it is equivalent to
  the model calling GuardianSubagentDispatch itself. See GuardianSubagentDispatch for the safety properties: no
  recursion, bounded turns, a filtered read-only tool set and a summary-only return.
starttaskid: "0"
tasks:
  "0":
    id: "0"
    taskid: a019369a-f737-4bd4-a90d-63586c20b767
    type: start
    task:
      id: a019369a-f737-4bd4-a90d-63586c20b767
      version: -1
      name: ""
      iscommand: false
      brand: ""
      description: ""
    nexttasks:
      '#none#':
      - "1"
    separatecontext: false
    view: |-
      {
        "position": {
          "x": 450,
          "y": 50
        }
      }
  "1":
    id: "1"
    taskid: 611baf8f-6976-458b-99f6-8367bbc5eb38
    type: regular
    task:
      id: 611baf8f-6976-458b-99f6-8367bbc5eb38
      version: -1
      name: Dispatch the specialist subagent
      description: >-
        Runs ONE bounded specialist sub-investigation to completion
        (GuardianSubagentDispatch) and returns its single summary. See the
        script's own module docstring for the filtered-tool-subset /
        no-recursion / bounded-iteration guarantees.
      script: 'GuardianSubagentDispatch'
      type: regular
      iscommand: false
      brand: ""
    scriptarguments:
      specialist:
        simple: ${inputs.specialist}
      task:
        simple: ${inputs.task}
      max_iterations:
        simple: ${inputs.max_iterations}
    nexttasks:
      '#none#':
      - "2"
    separatecontext: false
    view: |-
      {
        "position": {
          "x": 450,
          "y": 195
        }
      }
  "2":
    id: "2"
    taskid: 3f955529-2fc9-42a5-a939-9ab9c50cf513
    type: title
    task:
      id: 3f955529-2fc9-42a5-a939-9ab9c50cf513
      version: -1
      name: Done
      type: title
      iscommand: false
      brand: ""
    separatecontext: false
    view: |-
      {
        "position": {
          "x": 450,
          "y": 370
        }
      }
view: |-
  {
    "linkLabelsPosition": {},
    "paper": {
      "dimensions": {
        "height": 385,
        "width": 380,
        "x": 450,
        "y": 50
      }
    }
  }
inputs:
- key: specialist
  value:
    simple: phishing-analyst
  required: true
  description: >-
    Which named specialist to dispatch -- see GuardianSubagentDispatch.yml's
    own `specialist` arg for the current registry (today: "phishing-analyst").
  playbookInputQuery: null
- key: task
  value:
    simple: ""
  required: true
  description: >-
    The specific investigation task/question for this specialist run (e.g.
    "Is the email from billing-support@examp1e.com to this incident's
    reported user a phishing attempt?"). No default -- always set this when
    starting the playbook.
  playbookInputQuery: null
- key: max_iterations
  value:
    simple: "3"
  required: false
  description: >-
    Tool-calling iteration budget for this run. Defaults to 3, hard-capped
    at 5 by GuardianSubagentDispatch regardless of what is requested here.
  playbookInputQuery: null
outputs: []
adopted: true
fromversion: 6.10.0
marketplaces:
- marketplacev2
