id: GuardianModelAdaptation
version: -1
name: GuardianModelAdaptation
description: >-
  Guardian's daily model-adaptation run, started by the GuardianModelAdaptation Job (also runnable by hand).
  It measures the model that is enabled right now and saves the result to the guardian_model_profile List, so
  every investigation reads the model's measured limits instead of estimating them per incident. Steps: check
  the kill switch (the probe makes real, billable model calls, so a thrown kill switch skips it), probe the
  model with !guardian-probe-model (a throwaway warm-up call, then the tokens-per-character ratio, the
  context-window search and the tool-call and structured-output checks), save the result with
  GuardianModelProfileUpdate, then close this job run. A probe that did not produce a trustworthy
  measurement leaves the previous profile in place and says why in the War Room. The model SIZE is not
  measured; it comes from the model catalogue (guardian_model_catalog), looked up by the model name on every
  run, and only an explicit guardian_settings.model_tier or a profile override changes it. This playbook is
  deliberately separate from GuardianAgentLoop: it investigates nothing and the agent has no part in it, so no approval step applies.
