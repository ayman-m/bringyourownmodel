inputs:
- key: prompt
  value:
    simple: >-
      Triage already classified THIS issue (number ${incident.id}) as `${Guardian.Triage.investigation_type}`
      with severity `${Guardian.Triage.severity}` (it arrived as `${Guardian.Triage.original_severity}`),
      confidence ${Guardian.Triage.confidence}, likely benign: ${Guardian.Triage.likely_benign}. You are
      already assigned to this issue: do NOT search for or switch to another issue, never invent an id, and
      never ask anyone for it. Triage is a first look: confirm it or correct it from evidence. Make exactly
      ONE tool call per turn and read its result before choosing the next call.

      1) READ THE EVIDENCE PACKET pinned above. Besides the issue's own sections it holds `enrichment:`
      sections: read-only lookups the playbook already ran for this type. They hold the internet exposure of
      the asset, who changed the resource over the last 72 hours, and who read or used it over the last 24
      hours. Look for public or anonymous access, reads by identities or networks never seen before, and a
      recent change that opened access. A lookup that is not listed was skipped, had nothing to return, or
      failed; that is unknown, not clean. Do not repeat what is there.

      The triage inputs this playbook used: resource=`${Guardian.Triage.inputs.resource}`,
      anchor_time=`${Guardian.Triage.inputs.anchor_time}`. A lookup whose input is empty was skipped, not
      failed. Query windows are anchored on anchor_time when it is set (the hours before it and one hour
      after); when it is empty they count back from now. Do not run it yourself with a different kind of
      value: a VM, host or resource name is not an identity, and a subscription id is not an asset id. If the
      missing input matters, say so in your report. If you re-run a templated query, keep the template's
      default window and pass the same anchor_time unless you state why.

      2) FOLLOW THE ACTIVE SKILL and gather only what your question still needs. Stop when another call would
      not change your answer. A failed or empty lookup is not evidence either way: say so and carry on.

      3) Judge by the assessment mode, which the issue pin above states (family and mode). In `posture` mode the
      finding comes from a scanner: it is a fact about configuration, not a claim to corroborate, so confirm it still holds,
      then assess how exposed it is, what it protects, who owns it and what fixes it. In `verdict` mode the issue is a
      detector's claim: corroborate it with independent telemetry before you call it Malicious or Benign.

      4) If a memory row or an earlier resolution in the packet covers this rule or asset, use it and quote its key. A
      memory row is an earlier conclusion, often Guardian's own: check it against this issue's evidence instead of adopting
      it. How analysts closed earlier issues of the rule is in prior_rules; a resolution as a false positive is evidence.

      5) DOCUMENT: call GuardianCaseNote once, in the report format the skill gives. Keep the case note under 2500 characters. Notes over 4000 are
      rejected and cost a retry. Cut repetition and raw lists before findings: name each item once, summarise
      counts, and keep the verdict, key evidence and next steps. When you cite a cloud resource, copy its full
      resource id exactly as it appears in the evidence. Never shorten it with '...'.

      6) REMEMBER: if this run's evidence shows a durable pattern (a routine shown to be authorised, an
      accepted risk, a new risk), call GuardianMemory with op=store, a key that names the rule or the asset
      (for example rule:<rule id> or asset:<asset id>), a one-sentence value and tags. Store what you saw, not
      a guess: later runs on this rule read it.

      7) DECIDE. Do NOT change anything: no core-update-issue, no core-update-case, no containment. Propose the next action
      in your report instead.
      In `verdict` mode: `Malicious` = confirmed hostile activity; `Suspicious` = likely hostile but not confirmed; `Benign` =
      confirmed non-threat or expected activity; `Inconclusive` = genuinely insufficient signal in the issue's own evidence.
      `techniques` lists parent-level ATT&CK ids that match THIS activity (the `T####` in the template is a placeholder, never
      copy it), or [] if none apply. `confidence`: 90 or more only when a tool result or the packet confirms the key facts;
      40-70 when the evidence is partial. If nothing independent corroborates the detector, answer Suspicious (confidence
      40-70), not Malicious. Telemetry that shows the activity happened confirms the detector's facts, not that the activity
      was authorised: Benign at 70 or more needs evidence that it was expected (an earlier issue of this rule resolved as a
      false positive, a known automation identity doing its usual job, or the same identity doing the same thing from the
      same networks before). A source IP never seen on this tenant, failed sign-ins around the change, or a lookup that
      failed argue against Benign; when the activity is confirmed but its authorisation is not, answer Suspicious and
      propose confirming it with the owner.
      In `posture` mode: `Confirmed` = the condition still holds; `Not reproducible` = it no longer holds or the asset is gone;
      `Accepted risk candidate` = it holds, but the evidence shows a deliberate, contained or low-impact setup that an owner
      could accept. `priority` is P1 (fix now: internet-exposed or admin-level in production), P2, P3 or P4 (low impact); say
      why. `exposure`, `owner` and `fix` are each one short line; if the owner is unknown, write unknown.

      8) END with EXACTLY the final block for assessment mode `${Guardian.Triage.assessment_mode}` and nothing
      after it, as the system prompt and the skill give it: in `verdict` mode the verdict block (Malicious,
      Suspicious, Benign or Inconclusive, with confidence, techniques and summary); in `posture` mode the
      posture block (assessment Confirmed, Not reproducible or Accepted risk candidate, with priority P1 to
      P4, exposure, owner, fix and summary).
  required: false
  description: >-
    Prompt for the investigation session on this type. It says what triage concluded (from Guardian.Triage)
    and where the enrichment is, and carries the same judgment and conclusion rules as the
    GuardianInvestigateIssue prompt.
  playbookInputQuery: null
- key: max_ticks
  value:
    simple: ""
  required: false
  description: >-
    Optional cap on the model turns of the investigation session. Empty (the default) uses the same limit
    GuardianInvestigateIssue gets: the model size's limit, or the guardian_settings and model profile
    override. A number can only lower that limit. The parent playbook passes its investigate_max_ticks input.
  playbookInputQuery: null
