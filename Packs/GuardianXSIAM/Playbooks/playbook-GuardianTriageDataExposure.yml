id: GuardianTriageDataExposure
version: -1
name: GuardianTriageDataExposure
description: >-
  Triage branch for public or over-shared data, unusual data access or exfiltration. Collects the asset's
  internet exposure, who changed the resource and who only read it, adds them to the evidence packet, then
  runs a full investigation on the skill that matches the issue (detection skill for a detection, posture
  skill for a scanner finding). Everything it fetches is read-only; the model session proposes actions and
  takes none.
