id: GuardianTriageOther
version: -1
name: GuardianTriageOther
description: >-
  Triage branch for an issue that fits no type, or whose triage answer could not be used or did not fit the
  issue's domain. There is no type-specific enrichment, but the issue still gets a full investigation, of the
  same weight as GuardianInvestigateIssue: it loads the skill the issue route chose, runs one model session over
  the evidence packet and ends with the verdict or posture block. The issue's phase was already set to
  "Guardian triage: needs analyst" by the triage apply step. Everything the model session reads is read-only; it
  proposes actions and takes none.
