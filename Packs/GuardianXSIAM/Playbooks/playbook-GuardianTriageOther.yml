name: GuardianTriageOther
description: >-
  Triage branch for an issue that fits no type, or whose triage answer could not be used or did not fit the
  issue's domain. No model session runs: it writes one case note saying an analyst has to decide and why
  triage stopped (the triage apply step has already noted the summary and next step), and stops. The issue's
  phase was already set to "Guardian triage: needs analyst" by the triage apply step.
