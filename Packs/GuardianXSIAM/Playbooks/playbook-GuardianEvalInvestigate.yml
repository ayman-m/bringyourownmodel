inputs:
- key: prompt
  value:
    simple: >-
      You are a SOC analyst investigating THIS incident (you are already assigned to it -- do NOT
      search for or switch to another incident). Read this incident's `details` field, which contains
      the full case narrative including any threat-intel/enrichment outcomes already stated. Enrich the
      indicators you find (ip/domain/url/file/whois) to confirm, reason step by step, then DECIDE.
      Verdict rubric: `Malicious` = confirmed hostile activity; `Suspicious` = likely hostile but not
      confirmed; `Benign` = confirmed non-threat / expected activity, which needs evidence that the activity
      was authorised or routine, not only that it happened; `Inconclusive` = genuinely
      insufficient signal to decide. This run is READ-ONLY: do NOT call core-update-issue, core-update-case,
      or any state-changing tool. `techniques` lists the parent-level ATT&CK ids that match THIS
      incident's activity (the `T####` in the template is a format placeholder, never copy it), or []
      if none apply; name a technique only when the incident details or a tool result shows that
      specific behavior, never one inferred from the incident type. `confidence` is how sure the
      evidence makes you: 90 or more only when the key indicators were confirmed by a tool result or
      stated outright in the case, roughly 40-70 when the evidence is partial or mixed. Your FINAL message MUST end with EXACTLY this fenced block and nothing after it:
      ```json
      {"verdict": "Malicious|Suspicious|Benign|Inconclusive", "confidence": 0-100,
       "techniques": ["T####"], "summary": "one-line blast-radius / rationale"}
      ```
  required: true
  description: Eval investigation prompt -- investigate THIS incident and end with a verdict block.
  playbookInputQuery: null
- key: skill
  value:
    simple: cortex_case_investigation
  required: false
  description: Binds the run to the case-investigation skill.
  playbookInputQuery: null
- key: preload_skill
  value:
    simple: "false"
  required: false
  description: >-
    When "true", the skill named by the skill input is loaded and added to the model's system prompt (if it fits
    within 15% of max_input_tokens). Default "false": it costs a few thousand tokens per run and its benefit depends on the model and the task, so measure it for your own model before turning it on.
  playbookInputQuery: null
outputs: []
