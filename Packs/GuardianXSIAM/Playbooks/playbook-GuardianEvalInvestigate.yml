id: GuardianEvalInvestigate
version: -1
name: GuardianEvalInvestigate
description: >-
  The Guardian agent's run, as visible steps: check the kill switch, check the job guard, resolve the model profile,
  build the system prompt, build the tool list, load the skill (only when the preload_skill input is true), then one
  task that runs the whole model session. The steps before the session are plain preparation with no model involved.
  The session is one conversation: the model picks tools, the security gate vets each call, results return to the
  model, and approvals and the verdict are handled in the same session. It re-schedules itself once per turn until the
  model concludes, the kill switch is thrown or the turn limit is reached (25 for a small model, 40 for a medium one, 60 for a large one; MAX_TICKS in guardian_settings overrides), so do not wrap
  it in GenericPolling. The kill switch and job guard are also re-checked inside the session on every turn: the early
  checks give visibility and an early exit, they are not the only gates.
