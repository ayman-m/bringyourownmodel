id: GuardianTriageAndInvestigateIssue
version: -1
name: GuardianTriageAndInvestigateIssue
description: >-
  Triages THIS Cortex platform issue with a short model session, then runs a full investigation on it, acting
  on the triage answer by fixed rules, not by prose. The standard Guardian preparation (kill switch, job guard,
  issue routing, model profile, evidence packet, system prompt, tool list) is followed by one short triage
  session that ends with a fixed block (severity, type, confidence, analysis, recommendations). A program
  validates the block, with one repair call and then a fallback, and the playbook sets the issue's severity and
  phase (never its type), then branches by type to a sub-playbook that collects read-only enrichment and runs a
  full model investigation of the same weight as GuardianInvestigateIssue. The playbook writes the triage
  summary and the investigation conclusion as War Room notes and appends them to the issue's description in one
  delimited Guardian section (the original text is never changed). Containment and other state changes still
  wait for a human. The investigation playbook GuardianInvestigateIssue is unchanged.
