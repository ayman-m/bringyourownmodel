inputs:
- key: prompt
  value:
    simple: >-
      You are triaging THIS Cortex platform issue, number ${incident.id} (you are already assigned to it: do
      NOT search for or switch to another issue, never invent an id, and never ask anyone for it). This is a
      TRIAGE run: you rate the issue and name its type, you do not investigate it end to end.

      1) READ THE EVIDENCE PACKET pinned above first. It holds what the platform already knows: the issue's
      fields, the platform's remediation text, the asset details, the parent case, how earlier issues of the
      same rule were resolved, and what Guardian remembers about the rule and assets. Do not fetch again what
      is there. A section listed as not available is unknown, not empty.

      2) FOLLOW THE ACTIVE SKILL (cortex_triage). Make at most a few lookups, ONE tool call per turn, and only
      when the result could change the severity or the type: how common an address or file is, one ready-made
      GuardianXQL template, or the asset as the platform sees it now. A failed or empty lookup is not evidence
      either way: say so and carry on.

      3) Do NOT write a case note, do NOT store a memory row and do NOT change anything: no core-update-issue,
      no core-update-case, no containment. The playbook records the outcome.

      4) END with EXACTLY the triage block from the skill and nothing after it: severity, investigation_type,
      confidence, likely_benign, escalate, summary, key_entities and next_step, and optionally analysis (2-4
      sentences on what you saw and why you rated it so) and recommendations (up to 5 short next actions). Every
      value comes from the allowed lists in the skill; use `other` for the type when nothing fits.
  required: false
  description: >-
    Triage prompt: triage THIS issue by reading the pinned packet and the triage skill, with at most a few
    lookups, and end with exactly the triage block. No case note, no memory row, no changes.
  playbookInputQuery: null
- key: apply_changes
  value:
    simple: "true"
  required: false
  description: >-
    When "true" (the default), the triage result sets the issue's severity and phase through the guarded apply
    task. Set to "false" for a dry run that writes only the case note.
  playbookInputQuery: null
- key: triage_max_ticks
  value:
    simple: "6"
  required: false
  description: >-
    The most model turns the triage session may take. It can only lower the tick limit set in
    guardian_settings.
  playbookInputQuery: null
- key: investigate_max_ticks
  value:
    simple: ""
  required: false
  description: >-
    Optional cap on the model turns of the investigation session of the chosen sub-playbook (passed to its
    max_ticks input). Empty (the default) gives that session the same limit GuardianInvestigateIssue gets: the model
    size's limit (25, 40 or 60), or the guardian_settings and model profile override. A number can only lower
    that limit.
  playbookInputQuery: null
