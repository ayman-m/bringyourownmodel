        type, the description or the status. Raises severity on a structured result; lowers it only for a
        structured result of confidence 80 or more; a repaired or fallback result never changes severity.
        Skips an issue that has an owner, is resolved or was already triaged. With apply_changes set to false
        it writes only the case note. Every write and every skip leaves an audit row, and the note records the
        severity before and after.
