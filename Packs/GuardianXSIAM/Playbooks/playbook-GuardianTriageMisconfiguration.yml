id: GuardianTriageMisconfiguration
version: -1
name: GuardianTriageMisconfiguration
description: >-
  Triage branch for a cloud (CSPM) or Kubernetes policy finding. Collects the asset's internet exposure, the
  resource's recent change history and how widespread the rule's findings are, adds them to the evidence
  packet, then runs one focused model session on the posture skill. Everything it fetches is read-only; the
  model session proposes actions and takes none.
