inputs:
- key: prompt
  value:
    simple: >-
      Triage already classified THIS issue (number ${incident.id}) as `${Guardian.Triage.investigation_type}`
      with severity `${Guardian.Triage.severity}` (it arrived as `${Guardian.Triage.original_severity}`),
      confidence ${Guardian.Triage.confidence}, likely benign: ${Guardian.Triage.likely_benign}. You are
      already assigned to this issue: do NOT search for or switch to another issue, never invent an id, and
      never ask anyone for it. Triage is a first look: confirm it or correct it from evidence. Make exactly
      ONE tool call per turn and read its result before choosing the next call.

      1) READ THE EVIDENCE PACKET pinned above. Besides the issue's own sections it holds `enrichment:`
      sections: read-only lookups the playbook already ran for this type. They hold the internet exposure of
      the asset, who last changed the resource over 72 hours, and how many other issues the same rule has open
      (how widespread the finding is). Confirm the setting still holds, then judge exposure, environment,
      owner and fix. A lookup that is not listed was skipped, had nothing to return, or failed; that is
      unknown, not clean. Do not repeat what is there.

      The triage inputs this playbook used: resource=`${Guardian.Triage.inputs.resource}`,
      rule_id=`${Guardian.Triage.inputs.rule_id}`, anchor_time=`${Guardian.Triage.inputs.anchor_time}`. A
      lookup whose input is empty was skipped, not failed. Query windows are anchored on anchor_time when it
      is set (the hours before it and one hour after); when it is empty they count back from now. Do not run
      it yourself with a different kind of value: a VM, host or resource name is not an identity, and a
      subscription id is not an asset id. If the missing input matters, say so in your report. If you re-run a
      templated query, keep the template's default window and pass the same anchor_time unless you state why.

      2) FOLLOW THE ACTIVE SKILL and gather only what your question still needs. Stop when another call would
      not change your answer.

      3) DOCUMENT: call GuardianCaseNote once, in the report format the skill gives. Keep the case note under 2500 characters. Notes over 4000 are
      rejected and cost a retry. Cut repetition and raw lists before findings: name each item once, summarise
      counts, and keep the verdict, key evidence and next steps. When you cite a cloud resource, copy its full
      resource id exactly as it appears in the evidence. Never shorten it with '...'.

      4) REMEMBER: if this run's evidence shows a durable pattern (a routine shown to be authorised, an
      accepted risk, a new risk), call GuardianMemory with op=store, a key that names the rule or the asset
      (for example rule:<rule id> or asset:<asset id>), a one-sentence value and tags. Store what you saw, not
      a guess: later runs on this rule read it.

      5) Do NOT change anything: no core-update-issue, no core-update-case, no containment. Propose the next
      action in your report instead.

      6) END with EXACTLY the final block for assessment mode `${Guardian.Triage.assessment_mode}` and nothing
      after it, as the system prompt and the skill give it: in `verdict` mode the verdict block (Malicious,
      Suspicious, Benign or Inconclusive, with confidence, techniques and summary); in `posture` mode the
      posture block (assessment Confirmed, Not reproducible or Accepted risk candidate, with priority P1 to
      P4, exposure, owner, fix and summary).
  required: false
  description: >-
    Prompt for the focused model session on this type. It says what triage concluded (from Guardian.Triage)
    and where the enrichment is.
  playbookInputQuery: null
- key: max_ticks
  value:
    simple: ""
  required: false
  description: >-
    Optional cap on the model turns of the focused session. Empty (the default) uses the same limit
    GuardianInvestigateIssue gets: the model size's limit, or the guardian_settings and model profile
    override. A number can only lower that limit. The parent playbook passes its investigate_max_ticks input.
  playbookInputQuery: null
