name: GuardianTriageEndpointThreat
description: >-
  Triage branch for malware, suspicious execution or persistence on a host. Collects the endpoint and
  risky-host records, hash prevalence and the detection's contributing events, adds them to the evidence
  packet, then runs one focused model session on the detection skill. Everything it fetches is read-only; the
  model session proposes actions and takes none.
