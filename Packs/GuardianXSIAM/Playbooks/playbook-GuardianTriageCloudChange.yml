id: GuardianTriageCloudChange
version: -1
name: GuardianTriageCloudChange
description: >-
  Triage branch for a person or identity that changed cloud network, IAM or storage configuration. Collects
  the resource's recent change history, the actor's recent activity, how common the source IP is and the
  platform's asset record, adds them to the evidence packet, then runs one focused model session on the
  detection skill. Everything it fetches is read-only; the model session proposes actions and takes none.
