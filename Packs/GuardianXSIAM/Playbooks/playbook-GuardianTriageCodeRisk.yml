id: GuardianTriageCodeRisk
version: -1
name: GuardianTriageCodeRisk
description: >-
  Triage branch for infrastructure-as-code, secrets or package operational risk found in code. Collects the
  application-security issues with the same name and the other open issues of the rule, adds them to the
  evidence packet, then runs one focused model session on the vulnerability skill. Everything it fetches is
  read-only; the model session proposes actions and takes none.
