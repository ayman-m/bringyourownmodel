id: GuardianTriageIdentityThreat
version: -1
name: GuardianTriageIdentityThreat
description: >-
  Triage branch for a person or service identity whose sign-in or session looks abnormal. Collects the
  platform's risky-user record, the identity's last day of cloud activity, and how common its source IP is,
  adds them to the evidence packet, then runs one focused model session on the detection skill. Everything it
  fetches is read-only; the model session proposes actions and takes none.
