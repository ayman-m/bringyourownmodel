id: GuardianTriageAttackPath
version: -1
name: GuardianTriageAttackPath
description: >-
  Triage branch for a graph attack path from an entry point to a sensitive asset. Collects the platform's
  asset search for the assets on the path, the entry asset's internet exposure and the other open issues on
  these assets, adds them to the evidence packet, then runs one focused model session on the attack-path
  skill. The packet already holds each asset's details, so they are not fetched again here. Everything it
  fetches is read-only; the model session proposes actions and takes none.
