id: GuardianInvestigateIssue
version: -1
name: GuardianInvestigateIssue
description: >-
  Investigates THIS Cortex platform issue end to end with no human step: the standard Guardian preparation (kill switch,
  job guard, issue routing by family, model profile, system prompt, tool list, the family's skill), then one autonomous model session that checks
  its own memory, reads the issue and looks for similar ones, consults the knowledge base, documents its reasoning
  in a case note, remembers what it learned, and ends with a verdict. Containment and other state changes still wait
  for a human through the tool bridge. Use GuardianEvalInvestigate instead for scored, read-only evaluation runs.
