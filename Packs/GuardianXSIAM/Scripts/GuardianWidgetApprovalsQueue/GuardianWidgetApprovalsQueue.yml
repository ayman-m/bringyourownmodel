args: []
comment: >-
  Dashboard widget of the GuardianObservability dashboard. Shows the operator's queue of pending approvals
  from `guardian_approvals_ledger`, oldest first, with the age in minutes of each. It is a table widget, and
  its total is the number of pending approvals. It is read-only and never creates or writes
  `guardian_approvals_ledger`.
