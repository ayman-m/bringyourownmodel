args: []
comment: >-
  Layout section for the Guardian tab of the Guardian Agent Run layout. Shows this incident's rows from
  `guardian_audit` as an HTML table (tick, time, tool, status badge, target, duration, note) under a header
  that counts the calls per status: ok, pending_approval, denied, error and halted. Falls back to a markdown
  table if the HTML cannot be built. It reads the current incident, so it shows nothing in the Playground; run
  it on a real incident. It shows an empty state, not an error, when there are no rows. It never writes to
  `guardian_audit`.
commonfields:
  id: GuardianLayoutToolLedger
  version: -1
enabled: true
name: GuardianLayoutToolLedger
outputs: []
script: '-'
system: false
tags:
- dynamic-section
timeout: '0'
type: python
subtype: python3
dockerimage: demisto/python3:3.11.10.116949
fromversion: 6.10.0
marketplaces:
- marketplacev2
