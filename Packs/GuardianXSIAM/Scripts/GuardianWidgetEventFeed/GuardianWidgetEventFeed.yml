args: []
comment: >-
  Dashboard widget of the GuardianObservability dashboard. Shows a feed of recent important events from
  `guardian_audit` across all runs, newest first: denials, failures, kill-switch changes and jobs that were
  disabled. It is a table widget. It is read-only and never creates or writes `guardian_audit`.
