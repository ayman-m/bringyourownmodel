args:
- name: apply_changes
  description: >-
    "true" (the default) writes the issue's severity and phase. "false" is a dry run: the outcome is computed and
    reported, only the case note is added, and the issue is not changed. A value that is neither is treated as a dry
    run.
  required: false
  isArray: false
  default: false
  defaultValue: 'true'
  secret: false
  auto: PREDEFINED
  predefined:
  - 'true'
  - 'false'
comment: >-
  Operator-owned: applies a triage result (`Guardian.Triage`) to the current issue, behind guards. Changes only the
  issue's severity and phase, through one `core-update-issue` call, and never its type, description, name or status
  (the Guardian section of the description is written by GuardianIssueSummary, another operator-owned automation).
  Severity is raised only by a structured result, and lowered only by a structured result with a confidence of at
  least 80 that does not say escalate (a person must act within hours; a configuration weakness on a privileged account is not that, and an attempt that was blocked or failed, with no sign it succeeded (for example a blocked phishing email or a denied sign-in), does not escalate on its own); a repaired or fallback result never changes it. It skips an issue that has an owner, is closed or
  resolved, or was already triaged: in this context, or because the issue's own phase already starts with
  "Guardian triage:" (clear the phase to allow a re-triage to write again). It adds a case note with the before and after values and why,
  and leaves an audit row. It is on the denylist: the model can never call it.
commonfields:
  id: GuardianTriageApply
  version: -1
enabled: true
name: GuardianTriageApply
outputs:
- contextPath: Guardian.TriageApply.issue_id
  description: "The issue the result is about. It is the key that keeps a re-run one object."
  type: String
- contextPath: Guardian.TriageApply.status
  description: "applied (the issue was updated), dry_run (computed only), skipped (a guard stopped it) or error (the update failed)."
  type: String
- contextPath: Guardian.TriageApply.severity_before
  description: "The issue's severity before: low, medium, high, critical, informational or unknown."
  type: String
- contextPath: Guardian.TriageApply.severity_after
  description: "The severity after (the same as before when none was written; the would-be value on a dry run)."
  type: String
- contextPath: Guardian.TriageApply.phase
  description: "The phase written (or that would be written): 'Guardian triage: <branch>' or 'Guardian triage: needs analyst'. Empty when skipped."
  type: String
- contextPath: Guardian.TriageApply.reason
  description: "Why: the severity rule that applied and the phase, or the guard that skipped it."
  type: String
script: '-'
system: false
tags: []
timeout: '0'
type: python
subtype: python3
dockerimage: demisto/python3:3.11.10.116949
fromversion: 6.10.0
marketplaces:
- marketplacev2
